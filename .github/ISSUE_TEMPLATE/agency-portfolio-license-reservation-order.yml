name: Agency Portfolio annual reservation order
description: Request the ¥49,800 kickoff reservation for the ¥498,000 first-year Agency Portfolio License using public information only.
title: "[Agency Portfolio Annual Reservation] Order request"
labels:
  - buyer-intent
body:
  - type: markdown
    attributes:
      value: |
        Fixed offer: ¥49,800 kickoff reservation, credited in full to the ¥498,000 first-year Agency Portfolio License. Remaining first-year balance: ¥448,200.
        Scope: up to 500 organizations, 12 monthly differential CSV updates, and up to 10 users in one legal entity.
        Price lock: after fit is confirmed, written terms are accepted, and the reservation payment clears, the ¥498,000 first-year price is held for 30 calendar days. If the final order is not executed within that period, later pricing may apply. Reservation treatment, cancellation and refund terms are governed by the accepted written terms.
        Reservation confirmation: after the reservation payment clears, a private written confirmation will state the price-lock activation date, price-lock expiry date, ¥49,800 credit, ¥448,200 remaining first-year balance, selected procurement route, and agreed public-data scope. This reusable confirmation is intended to support the buyer's internal approval and final-order process.
        Reservation window: requests must be submitted by 2026-10-31 23:59 JST. This public cohort is capped at the first 10 reservations accepted after fit and written terms are confirmed. Submission time does not guarantee acceptance.
        Submitting this public form does not create a contract or charge. After fit is confirmed, written terms and payment details move to a private channel.
        Do not enter names, email addresses, billing details, private company data, credentials, employer-internal information, or confidential information.
  - type: dropdown
    id: readiness
    attributes:
      label: Transaction readiness
      description: Choose the closest purchasing timeframe.
      options:
        - "Ready to confirm scope and payment terms within 30 days"
        - "Evaluating within 90 days"
        - "Researching only"
    validations:
      required: true
  - type: dropdown
    id: reservation_invoice_intent
    attributes:
      label: Reservation invoice intent
      description: Choose the next commercial step after public-scope fit is confirmed. No invoice or charge is created by this public submission.
      options:
        - "After fit confirmation, send written terms and the ¥49,800 reservation invoice"
        - "Send written terms first; I will confirm whether to receive the invoice"
        - "Not ready to receive an invoice"
    validations:
      required: true
  - type: dropdown
    id: procurement_route
    attributes:
      label: Procurement route after written terms are accepted
      description: Choose the expected purchasing route. Do not enter billing or internal procurement details in this public form.
      options:
        - "Invoice can be paid after written terms are accepted; no purchase order expected"
        - "Purchase order can follow accepted written terms"
        - "Procurement route is not yet confirmed"
    validations:
      required: true
  - type: dropdown
    id: certification_scope
    attributes:
      label: Initial certification scope
      options:
        - "ISMS"
        - "ISMS plus another public certification type"
        - "Other public certification type"
    validations:
      required: true
  - type: input
    id: organization_count
    attributes:
      label: Requested first-month organization count
      description: Enter a number from 1 to 500.
      placeholder: "100"
    validations:
      required: true
  - type: input
    id: public_url
    attributes:
      label: Public organization or service URL
      description: Public URL only. Do not include private portals or personal information.
      placeholder: "https://example.com"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State the public-data fields or checks required for acceptance. Do not include confidential information.
      placeholder: "Example: CSV includes organization, official domain, certification type, expiry context, evidence URL, and observation date."
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Public-form acknowledgements
      options:
        - label: "I am requesting the ¥49,800 kickoff reservation credited to the ¥498,000 first-year license, subject to written fit and payment terms."
          required: true
        - label: "I understand that, after accepted written terms and cleared reservation payment, the ¥498,000 first-year price is held for 30 calendar days; later pricing may apply if the final order is not executed within that period."
          required: true
        - label: "I understand that the private reservation confirmation will record the lock dates, ¥49,800 credit, ¥448,200 remaining balance, procurement route, and agreed public-data scope."
          required: true
        - label: "I understand that this reservation window closes on 2026-10-31 at 23:59 JST and acceptance is limited to the first 10 fit-confirmed reservations."
          required: true
        - label: "I understand that submission alone creates no contract or charge."
          required: true
        - label: "I will not enter personal, billing, credential, employer-internal, or confidential information."
          required: true
        - label: "I understand that public certification evidence is not proof of purchase or renewal intent."
          required: true
