name: "#004 Evidence Pack E2E Monitor"

on:
  workflow_run:
    workflows: ["Public MVP"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: avf-004-e2e-monitor
  cancel-in-progress: true

jobs:
  production-e2e:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCT_URL: https://hirokimm.github.io/data-act-exit-audit/004/?avf_synthetic=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise representative Evidence Pack and buyer journey
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({acceptDownloads:true});
            const response = await page.goto(process.env.PRODUCT_URL + `&t=${Date.now()}`, {waitUntil:'networkidle'});
            if (!response || response.status() !== 200) throw new Error(`product HTTP ${response && response.status()}`);
            await page.fill('#audience', 'Procurement team');
            await page.fill('#completedAt', '2026-09-17');
            await page.fill('#context', 'Vendor selectionで生成AIを利用する際の確認事項');
            await page.fill('#topics', 'AIの限界、出力検証、機密情報の扱い、human oversight');
            await page.fill('#sources', 'European Commission AI Act official source; checked 2026-09-17');
            await page.fill('#updateLog', 'Representative production E2E record');
            await page.click('#generate');
            const preview = await page.textContent('#packPreview');
            const pack = JSON.parse(preview);
            if (pack.schema !== 'avf-004-evidence-pack-v1') throw new Error('unexpected pack schema');
            if (pack.record.audience !== 'Procurement team' || !pack.record.aiUseContext.includes('Vendor selection')) throw new Error('representative fields missing');
            const [jsonDownload] = await Promise.all([page.waitForEvent('download'), page.click('#downloadJson')]);
            const jsonPath = await jsonDownload.path();
            const jsonPack = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
            if (jsonPack.schema !== pack.schema || jsonPack.record.audience !== pack.record.audience) throw new Error('JSON download mismatch');
            const [csvDownload] = await Promise.all([page.waitForEvent('download'), page.click('#downloadCsv')]);
            const csvPath = await csvDownload.path();
            const csv = fs.readFileSync(csvPath, 'utf8');
            for (const expected of ['avf-004-evidence-pack-v1','Procurement team','Vendor selection']) if (!csv.includes(expected)) throw new Error(`CSV missing ${expected}`);
            if (!jsonDownload.suggestedFilename().endsWith('.json') || !csvDownload.suggestedFilename().endsWith('.csv')) throw new Error('download filenames invalid');
            const privacyHref = await page.getAttribute('a[href="../privacy.html"]','href');
            if (!privacyHref) throw new Error('privacy handoff missing');
            await page.fill('#email','qa@example.com');
            await page.fill('#site','https://example.com');
            await page.check('#consent');
            await page.click('#send');
            await page.waitForSelector('#ok',{state:'visible'});
            const confirmation = await page.textContent('#ok');
            if (!confirmation.includes('保存されません')) throw new Error(`synthetic confirmation missing: ${confirmation}`);
            if (await page.getAttribute('#ok','data-synthetic') !== 'true') throw new Error('synthetic response not confirmed');
            if (await page.getAttribute('#ok','data-retained') !== 'false') throw new Error('synthetic request unexpectedly retained');
            console.log('AVF-004 production E2E PASS: generate -> downloads -> privacy -> synthetic inquiry -> non-retained confirmation');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

  notify:
    if: ${{ always() && needs.production-e2e.result == 'failure' }}
    needs: production-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Create or refresh user-visible #004 monitoring alert
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[ALERT] #004 Evidence Pack production monitor';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = ['AI Venture Factory #004 automated production monitor.','',`Production E2E result: ${{ needs.production-e2e.result }}`,`Workflow run: ${runUrl}`,`Commit: ${context.sha}`,'Investigate the failed production E2E before treating the core flow as healthy.'].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({owner, repo, state:'open', per_page:100});
            const existing = issues.find(i => i.title === title);
            if (existing) await github.rest.issues.createComment({owner, repo, issue_number:existing.number, body});
            else await github.rest.issues.create({owner, repo, title, body, assignees:[owner]});
