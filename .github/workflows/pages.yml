name: Public MVP

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source
        run: |
          python3 -m py_compile scan.py render_report.py
          test -f public/index.html
          test -f public/privacy.html
          test -f public/terms.html
          test -f public/contact.html
      - name: Generate fresh public evidence
        run: |
          python3 scan.py --targets targets.json --out results.json
          python3 render_report.py --input results.json --out report.html
      - name: Assemble public artifact
        run: |
          mkdir -p dist
          cp -R public/. dist/
          cp report.html dist/report.html
          cp results.json dist/results.json
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path('dist/health.json').write_text(json.dumps({
            'ok': True,
            'service': 'venture-003-data-act-exit-audit',
            'commit': os.environ['GITHUB_SHA'],
            'run_id': os.environ['GITHUB_RUN_ID'],
            'repository': os.environ['GITHUB_REPOSITORY']
          }, separators=(',', ':')) + '\n')
          PY
          touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify anonymous production
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "${BASE_URL}health.json" -o health.json; then break; fi
            sleep 5
          done
          python3 - <<'PY'
          import json, os
          data=json.load(open('health.json'))
          assert data.get('ok') is True
          assert data.get('service') == 'venture-003-data-act-exit-audit'
          assert data.get('commit') == os.environ['EXPECTED_SHA']
          print('deployment identity verified:', data['commit'])
          PY
          for path in '' report.html privacy.html terms.html contact.html results.json robots.txt sitemap.xml; do
            code="$(curl --silent --show-error --location --max-time 20 -o /tmp/body -w '%{http_code}' "${BASE_URL}${path}")"
            echo "${path:-index.html}: HTTP ${code}"
            test "${code}" = "200"
          done
          grep -q 'SaaS Exit Evidence Audit' <(curl --fail --silent --location "${BASE_URL}")
          grep -q 'UNKNOWN' <(curl --fail --silent --location "${BASE_URL}report.html")
