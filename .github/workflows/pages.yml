name: Public MVP

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source
        run: |
          set -euo pipefail
          python3 -m py_compile scan.py render_report.py
          for f in public/index.html public/privacy.html public/terms.html public/contact.html public/004/index.html public/005/index.html public/005/public_candidate.html; do test -f "$f"; done
          grep -q 'Stage A public preview' public/004/index.html
          grep -q '¥9,800' public/004/index.html
          grep -q 'id="leadForm"' public/004/index.html
          grep -q 'https://ai-search-audit-dun.vercel.app/api/lead' public/004/index.html
          grep -q '¥9,800' public/005/index.html
          grep -q '¥19,800/月' public/005/index.html
          grep -q 'id="leadForm"' public/005/index.html
          grep -q 'https://ai-search-audit-dun.vercel.app/api/lead' public/005/index.html
          grep -q '期限は営業優先度を考える参考情報' public/005/index.html
          grep -q 'data_act_page_view' public/kpi.js
          grep -q 'avf_synthetic' public/kpi.js
          grep -q 'fixed event names' public/privacy.html
      - name: Generate fresh public evidence
        run: |
          python3 scan.py --targets targets.json --out results.json
          python3 render_report.py --input results.json --out report.html
          grep -q 'Recommended next actions' report.html
          grep -q 'View source evidence and scanner detail' report.html
          grep -q 'How to use this report:' report.html
      - name: Assemble public artifact
        run: |
          mkdir -p dist
          cp -R public/. dist/
          cp report.html dist/report.html
          cp results.json dist/results.json
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path('dist/health.json').write_text(json.dumps({'ok':True,'service':'venture-003-data-act-exit-audit','commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'repository':os.environ['GITHUB_REPOSITORY']},separators=(',',':'))+'\n')
          PY
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact anonymous production and private buyer routes
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
          LEAD_URL: https://ai-search-audit-dun.vercel.app/api/lead
          ORIGIN: https://hirokimm.github.io
        run: |
          set -euo pipefail
          identity_ok=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --location --max-time 20 "${BASE_URL}health.json" -o health.json && EXPECTED_SHA="$EXPECTED_SHA" python3 - <<'PY'
          import json, os
          d=json.load(open('health.json'))
          raise SystemExit(0 if d.get('ok') is True and d.get('commit')==os.environ['EXPECTED_SHA'] else 1)
          PY
            then identity_ok=true; break; fi
            sleep 5
          done
          test "$identity_ok" = true
          for path in '' report.html privacy.html terms.html contact.html results.json kpi.js 004/ 005/ 005/public_candidate.html; do
            code="$(curl --silent --location --max-time 20 -o /tmp/body -w '%{http_code}' "${BASE_URL}${path}")"
            echo "${path:-index.html}: HTTP ${code}"
            test "$code" = 200
          done
          curl --fail --silent --location "${BASE_URL}004/" -o /tmp/004.html
          curl --fail --silent --location "${BASE_URL}005/" -o /tmp/005.html
          grep -q '¥9,800' /tmp/004.html
          grep -q 'launch pilotを相談する' /tmp/004.html
          grep -q '¥9,800' /tmp/005.html
          grep -q '¥19,800/月' /tmp/005.html
          grep -q '有料CSVを申し込む' /tmp/005.html
          headers="$(mktemp)"
          preflight="$(curl --silent --max-time 20 -o /dev/null -D "$headers" -w '%{http_code}' -X OPTIONS -H "Origin: ${ORIGIN}" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "$LEAD_URL" || true)"
          echo "lead preflight=${preflight}"
          test "$preflight" = 204
          grep -qi "^access-control-allow-origin: ${ORIGIN}" "$headers"
          echo 'Exact Pages identity, #004/#005 priced private buyer routes, and lead transport preflight verified.'

  browser-qa:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    env:
      BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - run: npm install --global lighthouse@12
      - name: Render production mobile and desktop
        run: |
          set -euo pipefail
          lighthouse "${BASE_URL}?avf_synthetic=1" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=home-mobile.json
          lighthouse "${BASE_URL}004/?avf_synthetic=1" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=004-mobile.json
          lighthouse "${BASE_URL}004/?avf_synthetic=1" --quiet --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path=004-desktop.json
          lighthouse "${BASE_URL}005/?avf_synthetic=1" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=005-mobile.json
          lighthouse "${BASE_URL}005/?avf_synthetic=1" --quiet --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path=005-desktop.json
      - name: Assert usability
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const f of ['home-mobile.json','004-mobile.json','004-desktop.json','005-mobile.json','005-desktop.json']){
            const r=JSON.parse(fs.readFileSync(f,'utf8')); if(r.runtimeError) throw new Error(`${f}: runtime error`);
            for(const k of ['accessibility','best-practices']){const s=r.categories?.[k]?.score; console.log(f,k,s); if(typeof s!=='number'||s<0.90) throw new Error(`${f}: ${k} below 0.90`)}
          }
          NODE

  notify:
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.browser-qa.result == 'failure') }}
    runs-on: ubuntu-latest
    needs: [build, deploy, browser-qa]
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title='[ALERT] Public MVP monitor failure';
            const owner=context.repo.owner, repo=context.repo.repo;
            const body=`Build: ${process.env.BUILD}\nDeploy: ${process.env.DEPLOY}\nBrowser QA: ${process.env.QA}\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\nCommit: ${context.sha}`;
            const {data:issues}=await github.rest.issues.listForRepo({owner,repo,state:'open',per_page:100});
            const ex=issues.find(i=>i.title===title);
            if(ex) await github.rest.issues.createComment({owner,repo,issue_number:ex.number,body});
            else await github.rest.issues.create({owner,repo,title,body,assignees:[owner]});
        env:
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          QA: ${{ needs.browser-qa.result }}
