name: Public MVP

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source
        run: |
          python3 -m py_compile scan.py render_report.py
          test -f public/index.html
          test -f public/privacy.html
          test -f public/terms.html
          test -f public/contact.html
          test -f .github/ISSUE_TEMPLATE/paid-pilot.md
          grep -q 'Open public paid-pilot inquiry' public/index.html
          grep -q 'template=paid-pilot.md' public/index.html
          grep -q 'public GitHub Issue' public/index.html
          grep -q 'GitHub account/sign-in is required' public/index.html
          grep -q 'public GitHub Issue' public/contact.html
          grep -q 'Public submission notice' .github/ISSUE_TEMPLATE/paid-pilot.md
          grep -q 'monetization_interest' public/index.html
          grep -q 'data_act_page_view' public/kpi.js
          grep -q 'data_act_report_open' public/kpi.js
          grep -q 'data_act_contact_open' public/kpi.js
          grep -q 'data_act_monetization_interest' public/kpi.js
          grep -q 'https://ai-search-audit-dun.vercel.app/api/kpi' public/kpi.js
          grep -q "credentials:'omit'" public/kpi.js
          grep -q "avf_synthetic" public/kpi.js
          ! grep -Eq 'JSON.stringify\(\{[^}]*(path|query|url)' public/kpi.js
          grep -q "connect-src 'self' https://ai-search-audit-dun.vercel.app" public/index.html
          grep -q 'fixed event names' public/privacy.html
      - name: Generate fresh public evidence
        run: |
          python3 scan.py --targets targets.json --out results.json
          python3 render_report.py --input results.json --out report.html
      - name: Assemble public artifact
        run: |
          mkdir -p dist
          cp -R public/. dist/
          cp report.html dist/report.html
          cp results.json dist/results.json
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path('dist/health.json').write_text(json.dumps({
            'ok': True,
            'service': 'venture-003-data-act-exit-audit',
            'commit': os.environ['GITHUB_SHA'],
            'run_id': os.environ['GITHUB_RUN_ID'],
            'repository': os.environ['GITHUB_REPOSITORY']
          }, separators=(',', ':')) + '\n')
          PY
          touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify anonymous production and paid-pilot route
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
          CTA_URL: https://github.com/Hirokimm/data-act-exit-audit/issues/new?template=paid-pilot.md
          TEMPLATE_RAW: https://raw.githubusercontent.com/Hirokimm/data-act-exit-audit/main/.github/ISSUE_TEMPLATE/paid-pilot.md
          KPI_URL: https://ai-search-audit-dun.vercel.app/api/kpi
          KPI_ORIGIN: https://hirokimm.github.io
        run: |
          set -euo pipefail

          # Pages may briefly serve the prior artifact after deploy-pages returns.
          # Require the exact health identity and retry rather than misclassifying
          # normal CDN convergence as a product regression.
          identity_ok=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 20 "${BASE_URL}health.json" -o health.json; then
              if python3 - <<'PY'
          import json, os
          data=json.load(open('health.json'))
          ok=(data.get('ok') is True and
              data.get('service') == 'venture-003-data-act-exit-audit' and
              data.get('commit') == os.environ['EXPECTED_SHA'])
          if ok:
              print('deployment identity verified:', data['commit'])
              raise SystemExit(0)
          print('waiting for Pages convergence; current=', data.get('commit'))
          raise SystemExit(1)
          PY
              then
                identity_ok=true
                break
              fi
            fi
            echo "Waiting for exact Pages deployment identity ($attempt/12)..."
            sleep 5
          done
          test "$identity_ok" = true

          for path in '' report.html privacy.html terms.html contact.html results.json robots.txt sitemap.xml kpi.js; do
            code="$(curl --silent --show-error --location --max-time 20 -o /tmp/body -w '%{http_code}' "${BASE_URL}${path}")"
            echo "${path:-index.html}: HTTP ${code}"
            test "${code}" = "200"
          done
          curl --fail --silent --location "${BASE_URL}" -o /tmp/home.html
          curl --fail --silent --location "${BASE_URL}contact.html" -o /tmp/contact.html
          curl --fail --silent --location "${BASE_URL}privacy.html" -o /tmp/privacy.html
          curl --fail --silent --location "${BASE_URL}kpi.js" -o /tmp/kpi.js
          grep -q 'SaaS Exit Evidence Audit' /tmp/home.html
          grep -q 'Open public paid-pilot inquiry' /tmp/home.html
          grep -q 'template=paid-pilot.md' /tmp/home.html
          grep -q 'public GitHub Issue' /tmp/home.html
          grep -q 'GitHub account/sign-in is required' /tmp/home.html
          grep -q 'public GitHub Issue' /tmp/contact.html
          grep -q 'fixed event names' /tmp/privacy.html
          grep -q 'data_act_page_view' /tmp/kpi.js
          grep -q 'avf_synthetic' /tmp/kpi.js
          grep -q 'UNKNOWN' <(curl --fail --silent --location "${BASE_URL}report.html")

          cta_meta="$(curl --silent --show-error --location --max-time 20 -o /tmp/cta-body -w '%{http_code}|%{url_effective}' "$CTA_URL")"
          IFS='|' read -r cta_code cta_effective <<< "$cta_meta"
          echo "paid-pilot CTA: HTTP $cta_code effective=$cta_effective"
          test "$cta_code" = "200"
          case "$cta_effective" in
            https://github.com/login*|https://github.com/Hirokimm/data-act-exit-audit/issues/new*) ;;
            *) echo "unexpected paid-pilot route: $cta_effective"; exit 1 ;;
          esac

          curl --fail --silent --show-error --location --max-time 20 "$TEMPLATE_RAW" -o /tmp/paid-pilot.md
          grep -q 'name: Paid pilot inquiry' /tmp/paid-pilot.md
          grep -q 'Public submission notice' /tmp/paid-pilot.md
          grep -q 'GitHub account/sign-in is required' /tmp/paid-pilot.md
          grep -q 'One-time SaaS exit evidence audit' /tmp/paid-pilot.md
          grep -q 'Recurring monitoring / evidence report' /tmp/paid-pilot.md

          # The shared Vercel sink can converge independently of Pages. Retry the
          # complete CORS + event contract so inter-service propagation is not a
          # false outage while still requiring objective production evidence.
          # This direct probe is synthetic and must never be eligible B05 evidence.
          kpi_ok=false
          for attempt in $(seq 1 12); do
            cors_headers="$(mktemp)"
            preflight_code="$(curl --silent --show-error --max-time 20 -o /dev/null -D "$cors_headers" -w '%{http_code}' \
              -X OPTIONS -H "Origin: ${KPI_ORIGIN}" -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type' "${KPI_URL}" || true)"
            event_body="$(mktemp)"
            event_code="$(curl --silent --show-error --max-time 20 -o "$event_body" -w '%{http_code}' \
              -H "Origin: ${KPI_ORIGIN}" -H 'content-type: application/json' -H 'x-avf-synthetic: 1' \
              -d '{"event":"data_act_page_view"}' "${KPI_URL}" || true)"
            echo "KPI contract attempt $attempt/12: preflight=${preflight_code} event=${event_code}"
            if [[ "$preflight_code" == "204" ]] && \
               grep -qi "^access-control-allow-origin: ${KPI_ORIGIN}" "$cors_headers" && \
               [[ "$event_code" == "200" ]] && grep -q '"ok":true' "$event_body"; then
              kpi_ok=true
              break
            fi
            sleep 10
          done
          test "$kpi_ok" = true
          echo 'Production Pages identity and shared KPI transport contract verified with synthetic probe marking.'

  browser-qa:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    env:
      BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Install Lighthouse browser QA
        run: npm install --global lighthouse@12
      - name: Render production in mobile and desktop Chromium without polluting real KPI evidence
        run: |
          set -euo pipefail
          QA_URL="${BASE_URL}?avf_synthetic=1"
          lighthouse "${QA_URL}" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=mobile.json
          lighthouse "${QA_URL}" --quiet --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path=desktop.json
      - name: Assert browser usability and primary navigation
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['mobile.json', 'desktop.json']) {
            const r = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (r.runtimeError) throw new Error(`${file}: ${JSON.stringify(r.runtimeError)}`);
            const cats = r.categories || {};
            for (const key of ['accessibility', 'best-practices']) {
              const score = cats[key]?.score;
              console.log(`${file} ${key}:`, score);
              if (typeof score !== 'number' || score < 0.90) {
                throw new Error(`${file}: ${key} below 0.90`);
              }
            }
          }
          NODE
          for path in report.html results.json contact.html; do
            code="$(curl --silent --show-error --location --max-time 20 -o /tmp/body -w '%{http_code}' "${BASE_URL}${path}")"
            echo "browser QA navigation ${path}: HTTP ${code}"
            test "${code}" = "200"
          done

  notify:
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.browser-qa.result == 'failure' || contains(github.event.head_commit.message, '[test-alert]')) }}
    runs-on: ubuntu-latest
    needs: [build, deploy, browser-qa]
    steps:
      - name: Create or refresh user-visible monitoring alert
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[ALERT] #003 Public MVP monitor failure';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              'AI Venture Factory #003 automated monitor alert.',
              '',
              `Build result: ${process.env.BUILD_RESULT}`,
              `Deploy result: ${process.env.DEPLOY_RESULT}`,
              `Browser QA result: ${process.env.BROWSER_QA_RESULT}`,
              `Workflow run: ${runUrl}`,
              `Commit: ${context.sha}`,
              '',
              'If this was the explicit B12 alert-path test and all jobs are green, no production outage occurred.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({owner, repo, state: 'open', per_page: 100});
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner, repo, issue_number: existing.number, body});
              core.info(`refreshed issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({owner, repo, title, body, assignees: [owner]});
              core.info(`created issue #${created.data.number}`);
            }
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          BROWSER_QA_RESULT: ${{ needs.browser-qa.result }}
