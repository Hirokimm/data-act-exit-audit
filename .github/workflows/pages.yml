name: Public MVP

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source
        run: |
          python3 -m py_compile scan.py render_report.py
          test -f public/index.html
          test -f public/privacy.html
          test -f public/terms.html
          test -f public/contact.html
          test -f .github/ISSUE_TEMPLATE/paid-pilot.md
          grep -q 'Open public paid-pilot inquiry' public/index.html
          grep -q 'template=paid-pilot.md' public/index.html
          grep -q 'public GitHub Issue' public/index.html
          grep -q 'GitHub account/sign-in is required' public/index.html
          grep -q 'public GitHub Issue' public/contact.html
          grep -q 'Public submission notice' .github/ISSUE_TEMPLATE/paid-pilot.md
          grep -q 'monetization_interest' public/index.html
          grep -q 'monetization_interest' public/kpi.js
      - name: Generate fresh public evidence
        run: |
          python3 scan.py --targets targets.json --out results.json
          python3 render_report.py --input results.json --out report.html
      - name: Assemble public artifact
        run: |
          mkdir -p dist
          cp -R public/. dist/
          cp report.html dist/report.html
          cp results.json dist/results.json
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path('dist/health.json').write_text(json.dumps({
            'ok': True,
            'service': 'venture-003-data-act-exit-audit',
            'commit': os.environ['GITHUB_SHA'],
            'run_id': os.environ['GITHUB_RUN_ID'],
            'repository': os.environ['GITHUB_REPOSITORY']
          }, separators=(',', ':')) + '\n')
          PY
          touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify anonymous production and paid-pilot route
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
          CTA_URL: https://github.com/Hirokimm/data-act-exit-audit/issues/new?template=paid-pilot.md
          TEMPLATE_RAW: https://raw.githubusercontent.com/Hirokimm/data-act-exit-audit/main/.github/ISSUE_TEMPLATE/paid-pilot.md
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "${BASE_URL}health.json" -o health.json; then break; fi
            sleep 5
          done
          python3 - <<'PY'
          import json, os
          data=json.load(open('health.json'))
          assert data.get('ok') is True
          assert data.get('service') == 'venture-003-data-act-exit-audit'
          assert data.get('commit') == os.environ['EXPECTED_SHA']
          print('deployment identity verified:', data['commit'])
          PY
          for path in '' report.html privacy.html terms.html contact.html results.json robots.txt sitemap.xml; do
            code="$(curl --silent --show-error --location --max-time 20 -o /tmp/body -w '%{http_code}' "${BASE_URL}${path}")"
            echo "${path:-index.html}: HTTP ${code}"
            test "${code}" = "200"
          done
          curl --fail --silent --location "${BASE_URL}" -o /tmp/home.html
          curl --fail --silent --location "${BASE_URL}contact.html" -o /tmp/contact.html
          grep -q 'SaaS Exit Evidence Audit' /tmp/home.html
          grep -q 'Open public paid-pilot inquiry' /tmp/home.html
          grep -q 'template=paid-pilot.md' /tmp/home.html
          grep -q 'public GitHub Issue' /tmp/home.html
          grep -q 'GitHub account/sign-in is required' /tmp/home.html
          grep -q 'public GitHub Issue' /tmp/contact.html
          grep -q 'UNKNOWN' <(curl --fail --silent --location "${BASE_URL}report.html")

          # Verify the external CTA target itself is reachable. Anonymous users may
          # legitimately resolve to GitHub login; the return path preserves the
          # issue-template URL and the site discloses that sign-in is required.
          cta_meta="$(curl --silent --show-error --location --max-time 20 -o /tmp/cta-body -w '%{http_code}|%{url_effective}' "$CTA_URL")"
          IFS='|' read -r cta_code cta_effective <<< "$cta_meta"
          echo "paid-pilot CTA: HTTP $cta_code effective=$cta_effective"
          test "$cta_code" = "200"
          case "$cta_effective" in
            https://github.com/login*|https://github.com/Hirokimm/data-act-exit-audit/issues/new*) ;;
            *) echo "unexpected paid-pilot route: $cta_effective"; exit 1 ;;
          esac

          # Verify that the named template is publicly present with the disclosures
          # expected by the CTA. This guards against a dead/misnamed template link.
          curl --fail --silent --show-error --location --max-time 20 "$TEMPLATE_RAW" -o /tmp/paid-pilot.md
          grep -q 'name: Paid pilot inquiry' /tmp/paid-pilot.md
          grep -q 'Public submission notice' /tmp/paid-pilot.md
          grep -q 'GitHub account/sign-in is required' /tmp/paid-pilot.md
          grep -q 'One-time SaaS exit evidence audit' /tmp/paid-pilot.md
          grep -q 'Recurring monitoring / evidence report' /tmp/paid-pilot.md

  browser-qa:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    env:
      BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Install Lighthouse browser QA
        run: npm install --global lighthouse@12
      - name: Render production in mobile and desktop Chromium
        run: |
          set -euo pipefail
          lighthouse "${BASE_URL}" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=mobile.json
          lighthouse "${BASE_URL}" --quiet --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path=desktop.json
      - name: Assert browser usability and primary navigation
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['mobile.json', 'desktop.json']) {
            const r = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (r.runtimeError) throw new Error(`${file}: ${JSON.stringify(r.runtimeError)}`);
            const cats = r.categories || {};
            for (const key of ['accessibility', 'best-practices']) {
              const score = cats[key]?.score;
              console.log(`${file} ${key}:`, score);
              if (typeof score !== 'number' || score < 0.90) {
                throw new Error(`${file}: ${key} below 0.90`);
              }
            }
          }
          NODE
          for path in report.html results.json contact.html; do
            code="$(curl --silent --show-error --location --max-time 20 -o /tmp/body -w '%{http_code}' "${BASE_URL}${path}")"
            echo "browser QA navigation ${path}: HTTP ${code}"
            test "${code}" = "200"
          done

  notify:
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.browser-qa.result == 'failure' || contains(github.event.head_commit.message, '[test-alert]')) }}
    runs-on: ubuntu-latest
    needs: [build, deploy, browser-qa]
    steps:
      - name: Create or refresh user-visible monitoring alert
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[ALERT] #003 Public MVP monitor failure';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              'AI Venture Factory #003 automated monitor alert.',
              '',
              `Build result: ${process.env.BUILD_RESULT}`,
              `Deploy result: ${process.env.DEPLOY_RESULT}`,
              `Browser QA result: ${process.env.BROWSER_QA_RESULT}`,
              `Workflow run: ${runUrl}`,
              `Commit: ${context.sha}`,
              '',
              'If this was the explicit B12 alert-path test and all jobs are green, no production outage occurred.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({owner, repo, state: 'open', per_page: 100});
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner, repo, issue_number: existing.number, body});
              core.info(`refreshed issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({owner, repo, title, body, assignees: [owner]});
              core.info(`created issue #${created.data.number}`);
            }
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          BROWSER_QA_RESULT: ${{ needs.browser-qa.result }}
