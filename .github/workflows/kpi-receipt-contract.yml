name: KPI Receipt Contract

on:
  pull_request:
    paths:
      - 'public/kpi.js'
      - '.github/workflows/kpi-receipt-contract.yml'
  push:
    branches: [main]
    paths:
      - 'public/kpi.js'
      - '.github/workflows/kpi-receipt-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate privacy-safe client receipt consumption
        run: |
          set -euo pipefail
          grep -q 'venture-kpi-accepted' public/kpi.js
          grep -q 'kpiEvidenceVersion' public/kpi.js
          grep -q 'receipt.accepted' public/kpi.js
          grep -q 'receipt.evidenceVersion' public/kpi.js
          grep -q 'receipt.synthetic' public/kpi.js
          ! grep -Eq 'dataset\.(url|path|query|email|user|referrer)' public/kpi.js
      - name: Verify deployed shared sink receipt schema
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' \
            -H 'Origin: https://hirokimm.github.io' \
            -H 'content-type: application/json' \
            -H 'x-avf-synthetic: 1' \
            -d '{"event":"data_act_page_view","evidenceVersion":999,"url":"https://must-not-echo.example"}' \
            'https://ai-search-audit-dun.vercel.app/api/kpi')"
          test "$code" = '200'
          python3 - "$body" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          assert data == {'ok': True, 'accepted': True, 'evidenceVersion': 2, 'synthetic': True}, data
          print('privacy-safe receipt verified:', data)
          PY
